[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepepochs"
dynamic = ["version"]
description = "An easy-to-use tool for training PyTorch deep learning models"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [{name = "hitlic", email = "liuchen.lic@gmail.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "torch>=2.0.0",
    "pyyaml>=5.4",
    "tqdm>=4.62",
    "numpy>1.21",
    "matplotlib>=3.6",
    "tensorboard>=2.12",
    "scikit-learn>=0.22",
    "pandas>=1.3",
]

[project.urls]
Homepage = "https://github.com/hitlic/deepepochs"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepepochs", "deepepochs.*"]
namespaces = false

[tool.setuptools.dynamic]
version = {attr = "deepepochs.__version__"}
